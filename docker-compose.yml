# Servidor de pruebas. Se conecta al backend por la red compartida "waitlist-net"
# (creada una vez, y a la que backend/docker-compose.yml también se une):
#
#   docker network create waitlist-net    # una sola vez, si no existe ya
#   # levantar primero backend/docker-compose.yml, luego este
#   docker compose up -d --build
#
# WEB_PORT: puerto publicado en el host (por defecto 8080, no 80: un servidor de pruebas suele ya
# tener algo propio escuchando en el 80/443 — este contenedor no debe asumir que está libre).
# Si tienes tu propio nginx/apache al frente, apúntalo a este puerto; si no, pon WEB_PORT=80 tú mismo.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - waitlist-net

networks:
  waitlist-net:
    name: ${WAITLIST_NETWORK:-waitlist-net}
    external: true
