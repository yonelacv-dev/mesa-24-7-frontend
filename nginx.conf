# "api" es el nombre del servicio del backend en su docker-compose: se resuelve por la red
# compartida "waitlist-net" (misma que declara backend/docker-compose.yml).
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # imprescindible para los streams en vivo (SSE)
        proxy_read_timeout 1h;    # las conexiones de tiempo real se quedan abiertas
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # rutas del front: siempre cae en index.html (SPA)
    }
}
